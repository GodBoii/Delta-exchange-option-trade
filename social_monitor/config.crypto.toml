# Research roster reviewed 2026-10-20. Selection evidence is in ROSTER.md.
state_dir = "state"
crypto_only = true
# Four priority sources use 60 seconds; others retain the original research cadence.
# About 198 timeline page requests per 15 minutes including bounded reconciliation,
# before retries and lookups on the reply-inclusive endpoint. Its observed quota
# is 500; the original-only endpoint is just 50. Reset headers remain authoritative.
poll_seconds = 180
timeout_seconds = 20
batch_size = 80
page_size = 20
max_pages = 4
reconcile_seconds = 1800
request_spacing_seconds = 3
alert_max_age_seconds = 900
alert_on_first_poll = false

