# Research roster reviewed 2026-10-15. Following on X does not configure collection.
state_dir = "state"
crypto_only = true
# Twelve targets share one session. Start conservatively after prior rate limits.
poll_seconds = 180
timeout_seconds = 20
batch_size = 80
page_size = 20
max_pages = 4
reconcile_seconds = 1800
request_spacing_seconds = 3
alert_max_age_seconds = 900
alert_on_first_poll = false

# Original announcements and protocol developments.
