services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: Cloudflared
    env_file:
      - .cloudflared.env
    command:
      - tunnel
      - --no-autoupdate
      - --loglevel
      - info
      - --metrics
      - 0.0.0.0:2000
      - run
    depends_on:
      delta-exchange:
        condition: service_healthy
      binace:
        condition: service_healthy
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "localhost:2000", "ready"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
