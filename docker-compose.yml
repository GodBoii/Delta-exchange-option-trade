services:
  # The only application database. No host port; services reach it on the private network.
  trade-postgres:
    image: postgres:17.11-alpine3.24
    env_file:
      - ./deploy/local-postgres.env
    command:
      - postgres
      - -c
      - fsync=on
      - -c
      - synchronous_commit=on
      - -c
      - full_page_writes=on
      - -c
      - max_connections=200
    volumes:
      - trade-postgres:/var/lib/postgresql/data
    networks:
      - trade-data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 3s
      retries: 10

  # Daily compressed dump kept for seven days under ./data/backups.
  trade-postgres-backup:
    image: postgres:17.11-alpine3.24
    env_file:
      - ./deploy/local-postgres.env
    environment:
      PGHOST: trade-postgres
    entrypoint:
      - /bin/sh
      - -c
      - >-
        export PGPASSWORD="$$POSTGRES_PASSWORD";
        while :; do
        file="/backups/trade-$$(date -u +%Y%m%dT%H%M%SZ).dump";
        pg_dump -Fc -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -f "$$file.partial" && mv "$$file.partial" "$$file";
        find /backups -name 'trade-*.dump' -mtime +7 -delete;
        sleep 86400;
        done
    volumes:
      - ./data/backups:/backups
    networks:
      - trade-data
    depends_on:
      trade-postgres:
        condition: service_healthy
    restart: unless-stopped

  delta-exchange:
    container_name: Delta-exchange
    depends_on:
      trade-postgres:
        condition: service_healthy
    networks:
      - default
      - trade-data
    volumes:
      - trading-state:/app/state
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env.local
      - ./backend/.env
    environment:
      FRONTEND_ORIGINS: http://localhost:3000,https://delta-exchange-option-trade.vercel.app,https://tradecognition.online,https://www.tradecognition.online
      FRONTEND_ORIGIN_REGEX: ^https?://(localhost|127\.0\.0\.1|\[::1\])(:\d+)?$
      SCHEDULER_ENABLED: "true"
      SCHEDULER_POLL_SECONDS: "2"
      MAX_ENTRY_LATENESS_SECONDS: "180"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)); s=data['scheduler']; assert data['success'] and (not s['enabled'] or (s['running'] and s['lastCompletedAt'] and not s['lastError']))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  delta-exchange-reader:
    profiles: [read-replicas]
    depends_on:
      trade-postgres:
        condition: service_healthy
    networks:
      - default
      - trade-data
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env.local
      - ./backend/.env
    environment:
      TRADING_WRITER_ENABLED: "false"
      SCHEDULER_ENABLED: "false"
      AUTOMATION_SCHEDULER_ENABLED: "false"
      DELTA_EVENTS_ENABLED: "false"
    expose:
      - "8000"
    restart: unless-stopped
    init: true
    healthcheck:
      test: [CMD, python, -c, "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)); assert d['success'] and not d['scheduler']['enabled']"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  news-analyzer:
    container_name: bitcoin-agent
    build:
      context: ./backend
      dockerfile: Dockerfile.news-analyzer
    env_file:
      - .env.local
      - ./backend/.env
    depends_on:
      trade-postgres:
        condition: service_healthy
    networks:
      - default
      - trade-data
    environment:
      NEWS_LOG_LEVEL: DEBUG
      # The analysis service uses its own AI_DATABASE_URL role and never sees trading credentials.
      LOCAL_DATABASE_URL: ""
      LOCAL_READER_DATABASE_URL: ""
      CREDENTIAL_ENCRYPTION_KEY: ""
    expose:
      - "8002"
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=12)); assert data['success'] and data['service'] == 'news-analyzer' and data['databaseReady']"]
      interval: 30s
      timeout: 15s
      start_period: 10s
      retries: 3

  binace:
    container_name: Binace
    volumes:
      - market-history:/app/data
    build:
      context: ./binance_backend
      dockerfile: Dockerfile
    environment:
      BINANCE_BASE_URL: ${BINANCE_BASE_URL:-https://data-api.binance.vision}
      BINANCE_WS_URL: ${BINANCE_WS_URL:-wss://stream.binance.com:9443/stream}
      BINANCE_SYMBOL: ${BINANCE_SYMBOL:-BTCUSDT}
      DELTA_PUBLIC_BASE_URL: ${DELTA_PUBLIC_BASE_URL:-https://api.india.delta.exchange}
      DELTA_SYMBOL: ${DELTA_SYMBOL:-BTCUSD}
      DELTA_CONTEXT_SECONDS: ${DELTA_CONTEXT_SECONDS:-5}
      DELTA_HISTORY_SECONDS: ${DELTA_HISTORY_SECONDS:-300}
      MARKET_CACHE_SECONDS: ${MARKET_CACHE_SECONDS:-2}
      MARKET_BROADCAST_SECONDS: ${MARKET_BROADCAST_SECONDS:-0.25}
      WEBSOCKETS_MAX_LINE_LENGTH: ${WEBSOCKETS_MAX_LINE_LENGTH:-32768}
      CVD_WINDOW_SECONDS: ${CVD_WINDOW_SECONDS:-900}
      FRONTEND_ORIGINS: http://localhost:3000,https://delta-exchange-option-trade.vercel.app,https://tradecognition.online,https://www.tradecognition.online
      FRONTEND_ORIGIN_REGEX: ^https?://(localhost|127\.0\.0\.1|\[::1\])(:\d+)?$
    ports:
      - "${BINANCE_PORT:-8001}:8001"
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)); r=data['realtime']; assert data['success'] and data['service'] == 'binance-market-data-api' and r['connected'] and r['bookSynced'] and r['eventAgeMs'] is not None and r['eventAgeMs'] < 30000"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  trading-state:
  market-history:
  trade-postgres:

networks:
  trade-data:
    internal: true
